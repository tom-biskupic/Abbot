@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}

@if (loading()) {
  <p class="text-muted">Loading...</p>
}

@if (raceSeries(); as series) {
  <h1>{{ series.name }}</h1>

  <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
    <li [ngbNavItem]="'results'">
      <button ngbNavLink>Results</button>
      <ng-template ngbNavContent>
        <app-race-days [seriesId]="series.id!" />
      </ng-template>
    </li>
    <li [ngbNavItem]="'races'">
      <button ngbNavLink>Races</button>
      <ng-template ngbNavContent>
        <app-race-list [seriesId]="series.id!" />
      </ng-template>
    </li>
    <li [ngbNavItem]="'boats'">
      <button ngbNavLink>Registered Boats</button>
      <ng-template ngbNavContent>
        <p class="mt-3 text-muted">Registered boats coming soon.</p>
      </ng-template>
    </li>
    <li [ngbNavItem]="'points'">
      <button ngbNavLink>Points</button>
      <ng-template ngbNavContent>
        <p class="mt-3 text-muted">Points coming soon.</p>
      </ng-template>
    </li>
    <li [ngbNavItem]="'export'">
      <button ngbNavLink>Export</button>
      <ng-template ngbNavContent>
        <p class="mt-3 text-muted">Export coming soon.</p>
      </ng-template>
    </li>
    <li [ngbNavItem]="'settings'">
      <button ngbNavLink>Settings</button>
      <ng-template ngbNavContent>
        <app-settings-panel [seriesId]="series.id!" />
      </ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="nav" class="mt-2"></div>
}
