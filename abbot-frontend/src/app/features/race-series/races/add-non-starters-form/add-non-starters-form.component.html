<div class="modal-header">
  <h4 class="modal-title">Add results for non-starting boats</h4>
  <button type="button" class="btn-close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  @if (error) { <div class="alert alert-danger">{{ error }}</div> }
  <div class="mb-3">
    <label class="form-label">Result status for non-starting boats</label>
    <select class="form-select" [(ngModel)]="resultStatus" name="resultStatus">
      @for (s of statusOptions; track s.id) {
        <option [value]="s.id">{{ s.label }}</option>
      }
    </select>
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-primary" [disabled]="saving" (click)="ok()">
    @if (saving) { <span class="spinner-border spinner-border-sm me-1"></span> } OK
  </button>
  <button class="btn btn-secondary" [disabled]="saving" (click)="cancel()">Cancel</button>
</div>
