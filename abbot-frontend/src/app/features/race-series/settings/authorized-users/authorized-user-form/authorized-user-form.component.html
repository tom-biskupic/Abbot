<div class="modal-header">
  <h4 class="modal-title">Add Authorized User</h4>
  <button type="button" class="btn-close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  @if (generalError) { <div class="alert alert-danger">{{ generalError }}</div> }
  <form>
    <div class="mb-3">
      <label class="form-label">Email Address <span class="text-danger">*</span></label>
      <input class="form-control" [class.is-invalid]="fieldErrors['emailAddress']"
             type="email" [(ngModel)]="emailAddress" name="emailAddress"
             (ngModelChange)="clearFieldError('emailAddress')" />
      @if (fieldErrors['emailAddress']) {
        <div class="invalid-feedback">{{ fieldErrors['emailAddress'] }}</div>
      }
    </div>
  </form>
</div>
<div class="modal-footer">
  <button class="btn btn-primary" [disabled]="saving" (click)="ok()">
    @if (saving) { <span class="spinner-border spinner-border-sm me-1"></span> } OK
  </button>
  <button class="btn btn-secondary" [disabled]="saving" (click)="cancel()">Cancel</button>
</div>
