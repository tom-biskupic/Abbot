<div class="modal-header">
  <h4 class="modal-title">Handicap Limit</h4>
  <button type="button" class="btn-close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  @if (generalError) { <div class="alert alert-danger">{{ generalError }}</div> }
  <form>
    <div class="mb-3">
      <label class="form-label">Fleet <span class="text-danger">*</span></label>
      <select class="form-select" [class.is-invalid]="fieldErrors['fleet']"
              [(ngModel)]="limit.fleet" [compareWith]="compareById" name="fleet" required
              (ngModelChange)="clearFieldError('fleet')">
        <option [ngValue]="null" disabled>Select a fleet</option>
        @for (f of fleets; track f.id) {
          <option [ngValue]="f">{{ f.fleetName }}</option>
        }
      </select>
      @if (fieldErrors['fleet']) { <div class="invalid-feedback">{{ fieldErrors['fleet'] }}</div> }
    </div>
    <div class="mb-3">
      <label class="form-label">Handicap Limit <span class="text-danger">*</span></label>
      <input class="form-control" [class.is-invalid]="fieldErrors['limit']"
             type="number" min="0" max="99" [(ngModel)]="limit.limit" name="limit"
             (ngModelChange)="clearFieldError('limit')" />
      @if (fieldErrors['limit']) { <div class="invalid-feedback">{{ fieldErrors['limit'] }}</div> }
    </div>
  </form>
</div>
<div class="modal-footer">
  <button class="btn btn-primary" [disabled]="saving" (click)="ok()">
    @if (saving) { <span class="spinner-border spinner-border-sm me-1"></span> } OK
  </button>
  <button class="btn btn-secondary" [disabled]="saving" (click)="cancel()">Cancel</button>
</div>
