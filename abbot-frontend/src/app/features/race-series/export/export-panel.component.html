@if (error()) { <div class="alert alert-danger mt-3">{{ error() }}</div> }
@if (loading()) { <p class="text-muted mt-3">Loading...</p> }

@if (!loading()) {
  <!-- Export All -->
  <div class="border rounded p-3 mt-3">
    <h6 class="fw-semibold mb-3">Export</h6>
    @if (exportConfigs().length === 0) {
      <p class="text-muted small mb-0">No export configurations defined. Create one in Settings.</p>
    } @else {
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <select class="form-select form-select-sm" style="width: auto"
                [(ngModel)]="selectedExportConfig" name="exportConfig"
                [compareWith]="compareById">
          <option [ngValue]="undefined">-- Select export configuration --</option>
          @for (cfg of exportConfigs(); track cfg.id) {
            <option [ngValue]="cfg">{{ cfg.name }}</option>
          }
        </select>
        <button class="btn btn-sm btn-outline-primary" (click)="exportAll()"
                [disabled]="!selectedExportConfig">Export</button>
      </div>
    }
  </div>

  <!-- Export Handicap Tables -->
  <div class="border rounded p-3 mt-3">
    <h6 class="fw-semibold mb-3">Export Handicap Tables</h6>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <select class="form-select form-select-sm" style="width: auto"
              [(ngModel)]="selectedHandicapFleet" name="handicapFleet"
              [compareWith]="compareById">
        <option [ngValue]="undefined">-- Select fleet --</option>
        @for (f of fleets(); track f.id) {
          <option [ngValue]="f">{{ f.fleetName }}</option>
        }
      </select>
      <button class="btn btn-sm btn-outline-primary" (click)="exportHandicaps(false)"
              [disabled]="!selectedHandicapFleet">Export Long Course</button>
      <button class="btn btn-sm btn-outline-primary" (click)="exportHandicaps(true)"
              [disabled]="!selectedHandicapFleet">Export Short Course</button>
    </div>
  </div>
}
