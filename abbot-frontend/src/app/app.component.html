<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/" (click)="closeNav()">Abbot</a>
    <button class="navbar-toggler" type="button" [attr.aria-expanded]="navOpen()"
            [class.collapsed]="!navOpen()" (click)="toggleNav()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse" [class.collapse]="!navOpen()" [class.show]="navOpen()">
      <ul class="navbar-nav me-auto">
        @if (auth.isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/race-series" (click)="closeNav()">Race Series</a>
          </li>
        }
        @if (auth.isAdmin()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/users" (click)="closeNav()">Manage Users</a>
          </li>
        }
      </ul>
      <ul class="navbar-nav ms-auto">
        @if (auth.isAuthenticated()) {
          <li class="nav-item">
            <span class="nav-link text-light">{{ auth.user()?.name }}</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm ms-2" (click)="auth.logout(); closeNav()">Logout</button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" (click)="closeNav()">Login</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <router-outlet />
</div>
