language: java

jdk:
  - openjdk21

before_install:
  - nvm install 22
  - nvm use 22

install: true

script:
  - gradle build -s

after_success:
  - bash <(curl -s https://codecov.io/bash)

before_cache:
  - rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/

cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
    - abbot-frontend/node_modules/
