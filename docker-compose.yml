version: '3.3'
services:
  abbot-mysql:
    image: "mysql:9.5.0"
    ports:
      - 3306:3306
    networks:
      - todo_net
    volumes:
      - type: volume
        source: AbbotDB
        target: /var/lib/mysql 
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=AbbotDB
      - MYSQL_USER=AbbotUser
      - MYSQL_PASSWORD=password
  abbot:
    image: "tombi/abbot:2.0"
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - todo_net
    links:
      - abbot-mysql
    environment:
      - dbpassword=password
      - dbname=AbbotDB
      - dbuser=AbbotUser
      - dbhostname=abbot-mysql
      - serverport=8080
      - enable_ssl=true
      - server_port=8443
    volumes:
      - type: bind
        source: ./dev-certs
        target: /certs
volumes:
  AbbotDB:

networks:
  todo_net:
  
